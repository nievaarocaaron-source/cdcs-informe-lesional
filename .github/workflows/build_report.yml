name: Generar informe lesional (PDF)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión del informe"
        required: true
        default: "PRO"
        type: choice
        options:
          - PRO
          - CLASSIC

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar PDF
        run: |
          if [ "${{ github.event.inputs.version }}" = "PRO" ]; then
            echo "Ejecutando versión PRO"
            python scripts/make_report_PRO.py "data/REGISTRO LESIONAL.xlsx" "reports/informe_PRO_${{ github.run_number }}.pdf"
          else
            echo "Ejecutando versión CLASSIC"
            python scripts/make_report.py "data/REGISTRO LESIONAL.xlsx" "reports/informe_CLASSIC_${{ github.run_number }}.pdf"
          fi

      - name: Subir PDF como artifact
        uses: actions/upload-artifact@v4
        with:
          name: informe-lesional
          path: reports/*.pdf
