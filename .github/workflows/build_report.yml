name: Generar informe lesional (PDF)

on:
  push:
    paths:
      - "data/**.xlsx"
      - "scripts/**.py"
      - "requirements.txt"
      - "assets/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Generar PDF
        run: python scripts/make_report.py "data/REGISTRO LESIONAL.xlsx" "reports/informe_${{ github.run_number }}.pdf"

      - name: Subir PDF como descarga
        uses: actions/upload-artifact@v4
        with:
          name: informe-lesional
          path: reports/*.pdf
